<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hire talent or find work | Vorix Work</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap"><link rel="stylesheet" href="assets/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="assets/app.js"></script></head><body><header id="h"></header>
<main><section class="wrap hero"><h1>Businesses hire.<br>Freelancers deliver.</h1><p class="mu">Post a project, receive proposals, work with your chosen freelancer in a private workroom and leave a review when the job is done.</p>
<form action="projects.html" style="display:grid;grid-template-columns:3fr auto;gap:12px;max-width:620px"><input name="q" placeholder="Search projects by skill or title" aria-label="Search projects" style="margin:0"><button class="btn">Find projects</button></form><p style="margin-top:18px"><a class="btn o" href="login.html">Post a project</a> <a class="btn o" href="freelancers.html">Browse freelancers</a></p></section>
<section class="wrap sec"><h2 style="margin-bottom:18px">Open projects</h2><div class="grid" id="p"></div></section>
<section class="wrap sec"><h2 style="margin-bottom:18px">Freelancers</h2><div class="grid" id="f2"></div></section></main><footer id="f"></footer>
<script>V.init({},async()=>{$('#p').innerHTML=(await V.all('projects',30)).filter(p=>p.status=='open').slice(0,6).map(V.prj).join('')||'<p class="mu">No open projects yet.</p>';
const f=await V.all('freelancers',30);f.sort((a,b)=>(b.verified?1:0)-(a.verified?1:0));$('#f2').innerHTML=f.slice(0,6).map(V.fcard).join('')||'<p class="mu">No freelancers yet.</p>'})</script></body></html>
