<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find your next role | Vorix Careers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap"><link rel="stylesheet" href="assets/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script><script src="assets/app.js"></script></head><body><header id="h"></header>
<main><section class="wrap hero"><h1>Find work that<br>moves you forward.</h1><p class="mu">Search verified employers, apply in one click with your saved profile and track every application in one place.</p>
<form action="jobs.html" style="display:grid;grid-template-columns:2fr 1fr auto;gap:12px;max-width:760px"><input name="q" placeholder="Job title or skill" aria-label="Job title or skill" style="margin:0"><input name="loc" placeholder="City or Remote" aria-label="Location" style="margin:0"><button class="btn">Search jobs</button></form></section>
<section class="wrap sec"><h2 style="margin-bottom:18px">Browse by field</h2><div id="cats" style="display:flex;flex-wrap:wrap;gap:10px"></div></section>
<section class="wrap sec"><h2 style="margin-bottom:18px">Latest jobs</h2><div class="grid" id="g"></div></section>
<section class="wrap sec"><div class="card b" style="max-width:640px"><h3>Hiring?</h3><p class="mu" style="margin:6px 0 14px">Create an employer account, post a job and review applicants with a clear status for each.</p><a class="btn" href="login.html">Post a job</a></div></section></main><footer id="f"></footer>
<script>V.init({},async()=>{$('#cats').innerHTML=V.cats.map(c=>`<a class="btn o" href="jobs.html?cat=${c}">${c}</a>`).join('');$('#g').innerHTML=(await V.all('jobs',30)).filter(j=>j.open!==false).slice(0,6).map(V.jcard).join('')||'<p class="mu">No jobs posted yet.</p>'})</script></body></html>
