<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Vorix Work</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap"><link rel="stylesheet" href="assets/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="assets/app.js"></script></head><body><header id="h"></header>
<main class="wrap sec"><h1 id="w" style="font-size:40px"></h1><p class="mu" id="vs"></p><div class="two" style="margin-top:22px"><div style="display:grid;gap:22px">
<div class="card b"><h3 style="margin-bottom:10px">Business profile</h3><label for="cn">Business name</label><input id="cn"><label for="cw">Website (https://)</label><input id="cw"><label for="cc">Country</label><input id="cc"><label for="ca">About</label><textarea id="ca" rows="3"></textarea><button class="btn" id="sc">Save business</button></div>
<div class="card b"><h3 style="margin-bottom:10px">Post a project</h3><label for="pt">Project title</label><input id="pt"><label for="pc">Category</label><select id="pc"></select><label for="py">Budget type</label><select id="py"><option>Fixed</option><option>Hourly</option></select><label for="pb">Budget ($)</label><input id="pb" type="number" min="1"><label for="pl">Deadline (optional)</label><input id="pl" placeholder="30 days"><label for="ps">Skills needed</label><input id="ps"><label for="pd">Details</label><textarea id="pd" rows="4"></textarea><button class="btn" id="pj">Publish project</button></div></div>
<div><h3 style="margin-bottom:8px">My projects and proposals</h3><div class="card" id="mp"></div></div></div></main><footer id="f"></footer>
<script>let U,B,PR=[];const g=i=>$('#'+i).value.trim();
V.init({roles:['client']},async(u,me)=>{U=u;B=(await col('businesses').doc(u.uid).get()).data()||{name:me.name,verified:false,created:Date.now()};$('#pc').innerHTML=opts(V.cats);$('#w').textContent=B.name;
$('#vs').textContent=B.verified?'Your business is verified.':'Your business is waiting for verification. You can already post projects.';$('#cn').value=B.name||'';$('#cw').value=B.website||'';$('#cc').value=B.country||'';$('#ca').value=B.about||'';load()});
$('#sc').onclick=async()=>{if(!g('cn'))return alert('Enter your business name.');B={...B,name:g('cn'),website:g('cw'),country:g('cc'),about:g('ca')};await col('businesses').doc(U.uid).set(B);$('#w').textContent=B.name;alert('Business saved.')};
$('#pj').onclick=async()=>{if(!g('pt')||!g('pd')||!(+g('pb')>0))return alert('Enter a title, details and a budget.');await col('projects').add({owner:U.uid,businessName:B.name,title:g('pt'),category:$('#pc').value,budgetType:$('#py').value,budget:+g('pb'),deadline:g('pl'),skills:g('ps'),description:g('pd'),status:'open',hired:'',created:Date.now()});['pt','pb','pl','ps','pd'].forEach(i=>$('#'+i).value='');load()};
async function load(){const[p,r]=await Promise.all([col('projects').where('owner','==',U.uid).get(),col('proposals').where('client','==',U.uid).get()]);const L=s=>s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>b.created-a.created);PR=L(r);
$('#mp').innerHTML=L(p).map(x=>`<div class="row" style="display:block"><b><a href="project.html?id=${x.id}"><u>${esc(x.title)}</u></a></b> <span class="tag">${esc(x.status)}</span>
${x.status=='open'?(PR.filter(y=>y.project==x.id).map(y=>`<div style="margin:10px 0;padding:10px;border:1px solid var(--line)"><b><a href="profile.html?id=${esc(y.freelancer)}"><u>${esc(y.name)}</u></a></b> <span class="mu">${esc(y.title)}</span><br>$${esc(y.price)} in ${esc(y.days)} days, <span class="tag">${esc(y.status)}</span><p class="mu">${esc(y.cover)}</p>${y.status=='Pending'?`<button class="btn" data-ac="${y.id}">Accept</button> <button class="btn o" data-dc="${y.id}">Decline</button>`:''}</div>`).join('')||'<p class="mu">No proposals yet.</p>')+`<button class="btn o" data-cl="${x.id}">Close project</button>`:''}
${x.hired?`<p style="margin-top:8px"><a class="btn o" href="workroom.html?id=${x.id}">Open workroom</a></p>`:''}</div>`).join('')||'<p class="b mu">Publish your first project to start receiving proposals.</p>';
document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=async()=>{await col('proposals').doc(b.dataset.dc).update({status:'Declined'});load()});
document.querySelectorAll('[data-cl]').forEach(b=>b.onclick=async()=>{if(confirm('Close this project?')){await col('projects').doc(b.dataset.cl).update({status:'closed'});load()}});
document.querySelectorAll('[data-ac]').forEach(b=>b.onclick=async()=>{const y=PR.find(z=>z.id==b.dataset.ac);if(!confirm('Hire '+y.name+' for $'+y.price+'?'))return;const bt=db.batch();
PR.filter(z=>z.project==y.project&&z.status=='Pending').forEach(z=>bt.update(col('proposals').doc(z.id),{status:z.id==y.id?'Accepted':'Declined'}));
bt.update(col('projects').doc(y.project),{status:'in-progress',hired:y.freelancer,price:y.price});await bt.commit();load()})}</script></body></html>
