<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Vorix Careers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap"><link rel="stylesheet" href="assets/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script><script src="assets/app.js"></script></head><body><header id="h"></header>
<main class="wrap sec"><h1 style="font-size:40px;margin-bottom:20px">Moderation</h1><div class="two" style="grid-template-columns:1fr 1fr"><div><h3 style="margin-bottom:8px">Companies</h3><div class="card" id="p"></div></div><div><h3 style="margin-bottom:8px">Latest jobs</h3><div class="card" id="r"></div></div></div></main><footer id="f"></footer>
<script>V.init({roles:['admin']},()=>load());
async function load(){const[p,r]=await Promise.all([V.all('companies'),V.all('jobs',50)]);
$('#p').innerHTML=p.map(x=>`<div class="row"><span>${esc(x.name)}</span><span><button class="btn o" data-a="v" data-id="${x.id}" data-val="${x.verified?0:1}">${x.verified?'Unverify':'Verify'}</button></span></div>`).join('')||'<p class="b mu">No companies yet.</p>';
$('#r').innerHTML=r.map(x=>`<div class="row"><span>${esc(x.title)} <span class="mu">${esc(x.company)}</span></span><button class="btn o" data-a="j" data-id="${x.id}">Delete</button></div>`).join('')||'<p class="b mu">No jobs yet.</p>'}
document.onclick=async e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
if(a=='v')await col('companies').doc(id).update({verified:b.dataset.val=='1'});else if(confirm('Delete permanently?'))await col('jobs').doc(id).delete();load()}</script></body></html>
