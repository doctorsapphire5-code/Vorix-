<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project | Vorix Work</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap"><link rel="stylesheet" href="assets/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="assets/app.js"></script></head><body><header id="h"></header>
<main class="wrap sec" id="c"></main><footer id="f"></footer>
<script>const id=new URLSearchParams(location.search).get('id');
V.init({},async(u,me)=>{const d=await col('projects').doc(id).get();if(!d.exists){$('#c').innerHTML='<h2>Project not found</h2><p><a href="projects.html">Back to projects</a></p>';return}
const p=d.data();document.title=p.title+' | Vorix Work';const fr=me.role=='freelancer';let pp=null;
if(u&&fr){const s=await col('proposals').doc(id+'_'+u.uid).get();if(s.exists)pp=s.data()}
const side=p.status!='open'?'<p>This project is no longer open.</p>':pp?`<p><b>Your proposal:</b> $${esc(pp.price)} in ${esc(pp.days)} days.<br>Status: <span class="tag">${esc(pp.status)}</span></p>`:fr?'<label for="pr">Your price ($)</label><input id="pr" type="number" min="1"><label for="dy">Delivery time (days)</label><input id="dy" type="number" min="1"><label for="cv">Cover letter</label><textarea id="cv" rows="5" placeholder="Why are you the right person for this project?"></textarea><button class="btn" id="sb" style="width:100%">Send proposal</button>':u?'<p class="mu">Only freelancer accounts can send proposals.</p>':'<a class="btn" href="login.html?next='+encodeURIComponent('project.html?id='+id)+'">Log in to send a proposal</a>';
$('#c').innerHTML=`<div class="two"><div><span class="tag">${esc(p.category)}, ${esc(p.budgetType)} budget</span><h1 style="font-size:42px;margin:6px 0 10px">${esc(p.title)}</h1><p>${esc(p.businessName)}</p><p class="mu">Budget $${esc(p.budget)}${p.deadline?', deadline '+esc(p.deadline):''}</p><h3 style="margin:26px 0 8px">Project details</h3><p style="white-space:pre-wrap;max-width:680px">${esc(p.description)}</p><h3 style="margin:22px 0 8px">Skills needed</h3><p>${esc(p.skills||'')}</p></div><aside class="card b">${side}</aside></div>`;
if($('#sb'))$('#sb').onclick=async()=>{const f=(await col('freelancers').doc(u.uid).get()).data();if(!f||!f.title){alert('Complete your freelancer profile first.');return location.href='studio.html'}
const pr=+$('#pr').value,dy=+$('#dy').value,cv=$('#cv').value.trim();if(!pr||!dy||!cv)return alert('Enter a price, delivery time and cover letter.');
await col('proposals').doc(id+'_'+u.uid).set({project:id,projectTitle:p.title,client:p.owner,freelancer:u.uid,name:me.name,title:f.title,price:pr,days:dy,cover:cv,status:'Pending',created:Date.now()});location.reload()}})</script></body></html>
