<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employer | Vorix Careers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap"><link rel="stylesheet" href="assets/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script><script src="assets/app.js"></script></head><body><header id="h"></header>
<main class="wrap sec"><h1 id="w" style="font-size:40px"></h1><p class="mu" id="vs"></p><div class="two" style="margin-top:22px"><div style="display:grid;gap:22px">
<div class="card b"><h3 style="margin-bottom:10px">Company profile</h3><label for="cn">Company name</label><input id="cn"><label for="cw">Website (https://)</label><input id="cw"><label for="cl">Location</label><input id="cl"><label for="ca">About</label><textarea id="ca" rows="3"></textarea><button class="btn" id="sc">Save company</button></div>
<div class="card b"><h3 style="margin-bottom:10px">Post a job</h3><label for="jt">Job title</label><input id="jt"><label for="jl">Location</label><input id="jl"><label for="jc">Field</label><select id="jc"></select><label for="jy">Type</label><select id="jy"></select><label for="jm">Work mode</label><select id="jm"></select><label for="js">Salary (optional)</label><input id="js" placeholder="$60k to $80k"><label for="jd">Description</label><textarea id="jd" rows="4"></textarea><label for="jr">Requirements</label><textarea id="jr" rows="3"></textarea><button class="btn" id="pj">Publish job</button></div></div>
<div style="display:grid;gap:22px"><div><h3 style="margin-bottom:8px">Applicants</h3><div class="card" id="ap"></div></div><div><h3 style="margin-bottom:8px">My jobs</h3><div class="card" id="mj"></div></div></div></div></main><footer id="f"></footer>
<script>let U,C;const g=i=>$('#'+i).value.trim(),S=['Submitted','Reviewing','Interview','Offer','Rejected'];
V.init({roles:['employer']},async(u,me)=>{U=u;C=(await col('companies').doc(u.uid).get()).data()||{name:me.name,verified:false,created:Date.now()};
$('#jc').innerHTML=opts(V.cats);$('#jy').innerHTML=opts(V.types);$('#jm').innerHTML=opts(V.modes);
$('#w').textContent=C.name;$('#vs').textContent=C.verified?'Your company is verified.':'Your company is waiting for verification. You can already post jobs.';
$('#cn').value=C.name||'';$('#cw').value=C.website||'';$('#cl').value=C.location||'';$('#ca').value=C.about||'';load()});
$('#sc').onclick=async()=>{if(!g('cn'))return alert('Enter your company name.');C={...C,name:g('cn'),website:g('cw'),location:g('cl'),about:g('ca')};await col('companies').doc(U.uid).set(C);$('#w').textContent=C.name;alert('Company saved.')};
$('#pj').onclick=async()=>{if(!g('jt')||!g('jd'))return alert('Enter a title and a description.');await col('jobs').add({owner:U.uid,company:C.name,title:g('jt'),location:g('jl')||'Remote',category:$('#jc').value,type:$('#jy').value,mode:$('#jm').value,salary:g('js'),description:g('jd'),requirements:g('jr'),open:true,created:Date.now()});['jt','jl','js','jd','jr'].forEach(i=>$('#'+i).value='');load()};
async function load(){const[j,a]=await Promise.all([col('jobs').where('owner','==',U.uid).get(),col('applications').where('employer','==',U.uid).get()]);
const L=s=>s.docs.map(x=>({id:x.id,...x.data()})).sort((p,q)=>q.created-p.created);
$('#mj').innerHTML=L(j).map(x=>`<div class="row"><span><a href="job.html?id=${x.id}"><u>${esc(x.title)}</u></a><br><span class="mu">${x.open===false?'Closed':'Open'}</span></span><span><button class="btn o" data-t="${x.id}" data-o="${x.open===false?1:0}">${x.open===false?'Reopen':'Close'}</button> <button class="btn o" data-x="${x.id}">Delete</button></span></div>`).join('')||'<p class="b mu">No jobs yet.</p>';
$('#ap').innerHTML=L(a).map(x=>`<div class="row" style="display:block"><b>${esc(x.name)}</b> for ${esc(x.jobTitle)}<br><span class="mu">${esc(x.headline)}. ${esc(x.skills)}</span><p style="margin:6px 0">${esc(x.cover)}</p><a href="mailto:${esc(x.email)}"><u>${esc(x.email)}</u></a>${x.cvUrl?' <a href="'+esc(safe(x.cvUrl))+'" target="_blank" rel="noopener"><u>CV</u></a>':''}<select data-s="${x.id}" aria-label="Status">${S.map(s=>`<option${s==x.status?' selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<p class="b mu">Applicants will appear here.</p>';
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{await col('jobs').doc(b.dataset.t).update({open:b.dataset.o=='1'});load()});
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this job?')){await col('jobs').doc(b.dataset.x).delete();load()}});
document.querySelectorAll('[data-s]').forEach(s=>s.onchange=()=>col('applications').doc(s.dataset.s).update({status:s.value}))}</script></body></html>
