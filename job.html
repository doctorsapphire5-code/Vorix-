<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job | Vorix Careers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap"><link rel="stylesheet" href="assets/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script><script src="assets/app.js"></script></head><body><header id="h"></header>
<main class="wrap sec" id="c"></main><footer id="f"></footer>
<script>const id=new URLSearchParams(location.search).get('id');
V.init({},async(u,me)=>{const d=await col('jobs').doc(id).get();if(!d.exists){$('#c').innerHTML='<h2>Job not found</h2><p><a href="jobs.html">Back to jobs</a></p>';return}
const j=d.data();document.title=j.title+' | Vorix Careers';let co={};try{co=(await col('companies').doc(j.owner).get()).data()||{}}catch(e){}
const seeker=me.role=='seeker';let applied=false,saved=false;
if(u&&seeker){applied=(await col('applications').doc(id+'_'+u.uid).get()).exists;saved=(await col('users').doc(u.uid).collection('saved').doc(id).get()).exists}
const side=j.open===false?'<p>This job is closed.</p>':applied?'<p><b>You have applied.</b> Track it in <a href="applications.html"><u>My applications</u></a>.</p>':seeker?'<label for="cv">Cover note</label><textarea id="cv" rows="5" placeholder="Why are you a good fit?"></textarea><button class="btn" id="ap" style="width:100%">Apply now</button>':u?'<p class="mu">Only job seeker accounts can apply.</p>':'<a class="btn" href="login.html?next='+encodeURIComponent('job.html?id='+id)+'">Log in to apply</a>';
$('#c').innerHTML=`<div class="two"><div><span class="tag">${esc(j.type)}, ${esc(j.mode)}, ${esc(j.category)}</span><h1 style="font-size:42px;margin:6px 0 10px">${esc(j.title)}</h1><p>${esc(j.company)}${co.verified?' <span class="tag">verified employer</span>':''}</p><p class="mu">${esc(j.location)}${j.salary?', '+esc(j.salary):''}</p><h3 style="margin:28px 0 8px">About the role</h3><p style="white-space:pre-wrap;max-width:680px">${esc(j.description)}</p><h3 style="margin:24px 0 8px">Requirements</h3><p style="white-space:pre-wrap;max-width:680px">${esc(j.requirements||'')}</p></div><aside class="card b">${side}${seeker?'<button class="btn o" id="sv" style="width:100%;margin-top:10px">'+(saved?'Saved':'Save job')+'</button>':''}</aside></div>`;
if(seeker){$('#sv').onclick=async()=>{const r=col('users').doc(u.uid).collection('saved').doc(id);saved?await r.delete():await r.set({title:j.title,company:j.company,at:Date.now()});saved=!saved;$('#sv').textContent=saved?'Saved':'Save job'};
if($('#ap'))$('#ap').onclick=async()=>{const p=(await col('profiles').doc(u.uid).get()).data();if(!p||!p.headline){alert('Complete your profile first so employers can see who you are.');return location.href='profile.html'}
await col('applications').doc(id+'_'+u.uid).set({jobId:id,jobTitle:j.title,company:j.company,employer:j.owner,applicant:u.uid,name:me.name,email:u.email,headline:p.headline,skills:p.skills||'',cvUrl:p.cvUrl||'',cover:$('#cv').value.trim(),status:'Submitted',created:Date.now()});location.reload()}}})</script></body></html>
