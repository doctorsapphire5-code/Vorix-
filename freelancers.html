<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freelancers | Vorix Work</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap"><link rel="stylesheet" href="assets/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="assets/app.js"></script></head><body><header id="h"></header>
<main class="wrap sec"><h1 style="font-size:44px">Find freelancers</h1><div class="two" style="grid-template-columns:2fr 1fr;gap:12px;margin:22px 0 10px"><input id="q" placeholder="Name, title or skill" aria-label="Search"><input id="mr" type="number" min="0" placeholder="Maximum hourly rate ($)" aria-label="Maximum rate"></div><div class="grid" id="g"></div></main><footer id="f"></footer>
<script>V.init({},async()=>{const a=await V.all('freelancers');const r=()=>{const q=$('#q').value.toLowerCase(),m=+$('#mr').value||1e9;$('#g').innerHTML=a.filter(f=>(+f.rate||0)<=m&&(f.name+' '+(f.title||'')+' '+(f.skills||'')).toLowerCase().includes(q)).map(V.fcard).join('')||'<p class="mu">No freelancers match your search.</p>'};$('#q').oninput=$('#mr').oninput=r;r()})</script></body></html>
