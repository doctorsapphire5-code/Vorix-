<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My applications | Vorix Careers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap"><link rel="stylesheet" href="assets/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script><script src="assets/app.js"></script></head><body><header id="h"></header>
<main class="wrap sec"><h1 style="font-size:40px">My applications</h1><div class="card" id="a" style="margin:20px 0 40px"></div><h2 style="margin-bottom:16px">Saved jobs</h2><div class="card" id="s"></div></main><footer id="f"></footer>
<script>V.init({roles:['seeker']},async u=>{const [a,s]=await Promise.all([col('applications').where('applicant','==',u.uid).get(),col('users').doc(u.uid).collection('saved').get()]);
$('#a').innerHTML=a.docs.map(d=>d.data()).sort((x,y)=>y.created-x.created).map(x=>`<a class="row" href="job.html?id=${esc(x.jobId)}"><span><b>${esc(x.jobTitle)}</b><br><span class="mu">${esc(x.company)}</span></span><span class="tag">${esc(x.status)}</span></a>`).join('')||'<p class="b mu">No applications yet. <a href="jobs.html"><u>Browse jobs</u></a>.</p>';
$('#s').innerHTML=s.docs.map(d=>`<a class="row" href="job.html?id=${esc(d.id)}"><span><b>${esc(d.data().title)}</b><br><span class="mu">${esc(d.data().company)}</span></span></a>`).join('')||'<p class="b mu">Jobs you save will appear here.</p>'})</script></body></html>
