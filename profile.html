<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My profile | Vorix Careers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap"><link rel="stylesheet" href="assets/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script><script src="assets/app.js"></script></head><body><header id="h"></header>
<main class="wrap sec"><h1 style="font-size:40px;margin-bottom:20px">My profile and resume</h1><div class="two"><div class="card b"><label for="hl">Headline</label><input id="hl" data-k="headline" placeholder="Frontend developer with 4 years of experience"><label for="lo">Location</label><input id="lo" data-k="location"><label for="sk">Skills (comma separated)</label><input id="sk" data-k="skills"><label for="su">Summary</label><textarea id="su" data-k="summary" rows="3"></textarea><label for="ex">Experience</label><textarea id="ex" data-k="experience" rows="5"></textarea><label for="ed">Education</label><textarea id="ed" data-k="education" rows="3"></textarea><label for="cvf">Upload your CV (PDF, up to 10 MB)</label><input id="cvf" type="file" accept=".pdf,.doc,.docx"><button class="btn" id="sv">Save profile</button></div>
<div><div class="card b" id="pv"></div><button class="btn o np" style="margin-top:12px" onclick="print()">Print or save resume as PDF</button></div></div></main><footer id="f"></footer>
<script>let U,P={},N='';const K=[...document.querySelectorAll('[data-k]')];
V.init({roles:['seeker']},async(u,me)=>{U=u;N=me.name;P=(await col('profiles').doc(u.uid).get()).data()||{};K.forEach(i=>i.value=P[i.dataset.k]||'');pv()});
function pv(){const s=k=>esc(P[k]||'');$('#pv').innerHTML=`<h2>${esc(N)}</h2><p class="mu">${s('headline')} ${s('location')}</p><p style="margin:12px 0">${s('summary')}</p><h3>Skills</h3><p>${s('skills')}</p><h3 style="margin-top:12px">Experience</h3><p style="white-space:pre-wrap">${s('experience')}</p><h3 style="margin-top:12px">Education</h3><p style="white-space:pre-wrap">${s('education')}</p>${P.cvUrl?'<p class="np" style="margin-top:12px"><a href="'+esc(safe(P.cvUrl))+'" target="_blank" rel="noopener"><u>View uploaded CV</u></a></p>':''}`}
$('#sv').onclick=async()=>{const b=$('#sv');b.disabled=true;try{K.forEach(i=>P[i.dataset.k]=i.value.trim());const f=$('#cvf').files[0];
if(f){if(f.size>1e7)throw new Error('CV must be under 10 MB.');const r=st.ref(`cv/${U.uid}/${Date.now()}-${f.name.replace(/[^\w.-]/g,'_')}`);await r.put(f);P.cvUrl=await r.getDownloadURL()}
await col('profiles').doc(U.uid).set(P);pv();alert('Profile saved.')}catch(x){alert(x.message)}b.disabled=false}</script></body></html>
