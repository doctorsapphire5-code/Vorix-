<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freelancer | Vorix Work</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap"><link rel="stylesheet" href="assets/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="assets/app.js"></script></head><body><header id="h"></header>
<main class="wrap sec" id="c"></main><footer id="f"></footer>
<script>const id=new URLSearchParams(location.search).get('id');
V.init({},async()=>{const d=await col('freelancers').doc(id).get();if(!d.exists){$('#c').innerHTML='<h2>Profile not found</h2><p><a href="freelancers.html">Back to freelancers</a></p>';return}
const f=d.data();document.title=f.name+' | Vorix Work';const rv=(await col('reviews').where('freelancer','==',id).get()).docs.map(x=>x.data()).sort((a,b)=>b.created-a.created);
const avg=rv.length?(rv.reduce((s,x)=>s+x.rating,0)/rv.length).toFixed(1):null;
$('#c').innerHTML=`<span class="tag">${f.verified?'Verified freelancer':'Freelancer'}</span><h1 style="font-size:44px;margin:6px 0 8px">${esc(f.name)}</h1><p>${esc(f.title||'')}</p><p class="mu">${esc(f.country||'')} ${f.rate?', $'+esc(f.rate)+'/hour':''}</p><p style="margin:10px 0"><b>${avg?avg+' out of 5':'No reviews yet'}</b> <span class="mu">${rv.length?'from '+rv.length+' completed projects':''}</span></p><p style="max-width:680px;margin:14px 0">${esc(f.bio||'')}</p><h3>Skills</h3><p>${esc(f.skills||'')}</p>${f.portfolio?`<p style="margin-top:12px"><a class="btn o" href="${esc(safe(f.portfolio))}" target="_blank" rel="noopener">View portfolio</a></p>`:''}
<h2 style="margin:36px 0 16px">Client reviews</h2><div class="grid">${rv.map(x=>`<div class="card b"><span class="tag">${'★'.repeat(x.rating)} ${x.rating}/5</span><h3>${esc(x.projectTitle)}</h3><p>${esc(x.text||'')}</p><p class="mu">${esc(x.clientName)}</p></div>`).join('')||'<p class="mu">Reviews appear after a client completes a project.</p>'}</div>`})</script></body></html>
