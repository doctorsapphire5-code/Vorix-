<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projects | Vorix Work</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap"><link rel="stylesheet" href="assets/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="assets/app.js"></script></head><body><header id="h"></header>
<main class="wrap sec"><h1 style="font-size:44px">Find projects</h1><div class="two" style="grid-template-columns:2fr 1fr 1fr;gap:12px;margin:22px 0 10px"><input id="q" placeholder="Title or skill" aria-label="Search"><select id="ca" aria-label="Category"></select><input id="mb" type="number" min="0" placeholder="Minimum budget ($)" aria-label="Minimum budget"></div><p class="mu" id="n" style="margin-bottom:14px"></p><div class="grid" id="g"></div></main><footer id="f"></footer>
<script>V.init({},async()=>{const a=(await V.all('projects')).filter(p=>p.status=='open');$('#ca').innerHTML='<option value="">All categories</option>'+opts(V.cats);$('#q').value=new URLSearchParams(location.search).get('q')||'';
const r=()=>{const q=$('#q').value.toLowerCase(),c=$('#ca').value,m=+$('#mb').value||0,f=a.filter(p=>(!c||p.category==c)&&p.budget>=m&&(p.title+' '+(p.skills||'')+' '+p.businessName).toLowerCase().includes(q));$('#n').textContent=f.length+' open projects';$('#g').innerHTML=f.map(V.prj).join('')||'<p class="mu">No projects match. Try fewer filters.</p>'};
document.querySelectorAll('input,select').forEach(x=>x.oninput=x.onchange=r);r()})</script></body></html>
