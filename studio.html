<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My work | Vorix Work</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap"><link rel="stylesheet" href="assets/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="assets/app.js"></script></head><body><header id="h"></header>
<main class="wrap sec"><h1 id="w" style="font-size:40px"></h1><p class="mu" id="vs"></p><div class="two" style="margin-top:22px"><div class="card b"><h3 style="margin-bottom:10px">Public profile</h3><label for="ti">Professional title</label><input id="ti" data-k="title" placeholder="Senior UI designer"><label for="sk">Skills (comma separated)</label><input id="sk" data-k="skills"><label for="ra">Hourly rate ($)</label><input id="ra" type="number" min="0" data-k="rate"><label for="co">Country</label><input id="co" data-k="country"><label for="po">Portfolio link (https://)</label><input id="po" data-k="portfolio"><label for="bi">About you</label><textarea id="bi" rows="5" data-k="bio"></textarea><button class="btn" id="sv">Save profile</button></div>
<div style="display:grid;gap:22px"><div><h3 style="margin-bottom:8px">Active and finished work</h3><div class="card" id="aw"></div></div><div><h3 style="margin-bottom:8px">My proposals</h3><div class="card" id="mp"></div></div></div></div></main><footer id="f"></footer>
<script>let U,F;const K=[...document.querySelectorAll('[data-k]')];
V.init({roles:['freelancer']},async(u,me)=>{U=u;F=(await col('freelancers').doc(u.uid).get()).data()||{name:me.name,verified:false,created:Date.now()};$('#w').textContent=F.name;$('#vs').innerHTML=(F.verified?'Your profile is verified. ':'Your profile is waiting for verification. ')+'<a href="profile.html?id='+u.uid+'"><u>View public page</u></a>';K.forEach(i=>i.value=F[i.dataset.k]||'');load()});
$('#sv').onclick=async()=>{K.forEach(i=>F[i.dataset.k]=i.type=='number'?(+i.value||0):i.value.trim());if(!F.title)return alert('Enter your professional title.');await col('freelancers').doc(U.uid).set(F);alert('Profile saved.')};
async function load(){const[a,p]=await Promise.all([col('projects').where('hired','==',U.uid).get(),col('proposals').where('freelancer','==',U.uid).get()]);const L=s=>s.docs.map(x=>({id:x.id,...x.data()})).sort((x,y)=>y.created-x.created);
$('#aw').innerHTML=L(a).map(x=>`<a class="row" href="workroom.html?id=${x.id}"><span><b>${esc(x.title)}</b><br><span class="mu">${esc(x.businessName)}</span></span><span class="tag">${esc(x.status)}</span></a>`).join('')||'<p class="b mu">Accepted projects appear here.</p>';
$('#mp').innerHTML=L(p).map(x=>`<div class="row"><span><a href="project.html?id=${esc(x.project)}"><u>${esc(x.projectTitle)}</u></a><br><span class="mu">$${esc(x.price)} in ${esc(x.days)} days</span></span><span><span class="tag">${esc(x.status)}</span> ${x.status=='Pending'?'<button class="btn o" data-w="'+x.id+'">Withdraw</button>':''}</span></div>`).join('')||'<p class="b mu">No proposals yet. <a href="projects.html"><u>Find projects</u></a>.</p>';
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=async()=>{await col('proposals').doc(b.dataset.w).update({status:'Withdrawn'});load()})}</script></body></html>
