<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jobs | Vorix Careers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap"><link rel="stylesheet" href="assets/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script><script src="assets/app.js"></script></head><body><header id="h"></header>
<main class="wrap sec"><h1 style="font-size:44px">Find a job</h1><div class="two" style="grid-template-columns:2fr 1.2fr 1fr 1fr 1fr;gap:12px;margin:22px 0 10px"><input id="q" placeholder="Title or skill" aria-label="Title or skill"><input id="lo" placeholder="Location" aria-label="Location"><select id="ca" aria-label="Field"></select><select id="ty" aria-label="Type"></select><select id="mo" aria-label="Work mode"></select></div><p class="mu" id="n" style="margin-bottom:14px"></p><div class="grid" id="g"></div></main><footer id="f"></footer>
<script>const P=new URLSearchParams(location.search);
V.init({},async()=>{const a=(await V.all('jobs')).filter(j=>j.open!==false);
$('#ca').innerHTML='<option value="">All fields</option>'+opts(V.cats);$('#ty').innerHTML='<option value="">Any type</option>'+opts(V.types);$('#mo').innerHTML='<option value="">Any mode</option>'+opts(V.modes);
$('#q').value=P.get('q')||'';$('#lo').value=P.get('loc')||'';$('#ca').value=P.get('cat')||'';
const r=()=>{const q=$('#q').value.toLowerCase(),l=$('#lo').value.toLowerCase(),c=$('#ca').value,t=$('#ty').value,m=$('#mo').value;
const f=a.filter(j=>(!c||j.category==c)&&(!t||j.type==t)&&(!m||j.mode==m)&&(j.title+' '+j.company+' '+(j.requirements||'')).toLowerCase().includes(q)&&(j.location||'').toLowerCase().includes(l));
$('#n').textContent=f.length+' jobs found';$('#g').innerHTML=f.map(V.jcard).join('')||'<p class="mu">No jobs match. Try fewer filters.</p>'};
document.querySelectorAll('input,select').forEach(x=>x.oninput=x.onchange=r);r()})</script></body></html>
